services: 
  backend:
    build: ./backend
    container_name: esonero_backend
    ports:
      - "8003:8003"
    volumes:
      - ./gs_data:/app/gs_data
      - ./domains.json:/app/domains.json

  frontend:
    build: ./frontend
    container_name: esonero_frontend
    ports:
      - "8004:8004"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8003