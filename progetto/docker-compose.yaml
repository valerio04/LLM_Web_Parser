version: '3.8'

services: 
  backend:
    build: ./backend
    ports:
      - "8003:8003"
    volumes:
      - ./gs_data:/app/gs_data
      - ./domain.json:/app/domains.json
    restart: always

    frontend:
      build: ./frontend
      ports:
        - "8004:8004"
      depends_on:
        - backend
      environment:
        - BACKEND_URL=http://backend:8003
      restart: always