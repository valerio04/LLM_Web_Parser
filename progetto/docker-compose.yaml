services: 
  mariadb:
    image: mariadb:11.7.2-ubi9
    container_name: minerva-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: minerva_db
      MYSQL_USER: minerva_user
      MYSQL_PASSWORD: minerva_pwd
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u minerva_user -pminerva_pwd || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  
  ollama:
    image: ollama/ollama
    container_name: ollama
    environment:
      OLLAMA_MODEL: phi4-mini:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      ollama serve &
      echo 'Aspetto che Ollama sia pronto...';
      until ollama list >/dev/null 2>&1; do
        sleep 2;
      done;
      echo 'Scarico il modello se non presente...';
      ollama pull $${OLLAMA_MODEL};
      echo 'Modello pronto.';
      wait
      "
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'phi4-mini' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s

  backend:
    build: ./backend
    container_name: esonero_backend
    ports:
      - "8003:8003"
    volumes:
      - ./gs_data:/gs_data
      - ./domains.json:/domains.json
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: minerva_user
      DB_PASSWORD: minerva_pwd
      DB_NAME: minerva_db
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: phi4-mini:latest
    depends_on:
      mariadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: >
      sh -c "
      python src/db/init_db.py &&
      uvicorn src.server:app --host 0.0.0.0 --port 8003
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8003/docs\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: esonero_frontend
    ports:
      - "8004:8004"
    volumes:
      - ./gs_data:/gs_data
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8003

volumes:
  mariadb_data:
  ollama_data: